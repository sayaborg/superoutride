name: Temporary SPECTRAL game source export
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  export:
    if: github.head_ref == 'codex/tire-spectral-game'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
          path: repo
      - name: Archive source checkout
        run: tar -czf source-workspace.tar.gz repo
      - uses: actions/upload-artifact@v4
        with:
          name: spectral-game-source
          path: source-workspace.tar.gz
          retention-days: 1
