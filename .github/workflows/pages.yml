name: Test and Deploy GitHub Pages

# Pages source must be set to GitHub Actions in repository Settings > Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Verify exact checkout
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          echo "expected=${EXPECTED_SHA}"
          echo "actual=${ACTUAL_SHA}"
          test "${ACTUAL_SHA}" = "${EXPECTED_SHA}"

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      - name: Test and build
        run: npm test

      - name: Stage static site
        if: github.event_name != 'pull_request'
        run: |
          BUILD_ID="${GITHUB_SHA}"
          mkdir -p "_site/build/${BUILD_ID}"
          cp index.html styles.css _site/

          # Commit-versioned build path is the browser authority. Because every relative
          # ESM import stays under this directory, a new deployment cannot mix old and
          # new cached modules.
          cp -R dist/. "_site/build/${BUILD_ID}/"
          printf '%s\n' "${BUILD_ID}" > _site/version.txt

          # Keep the legacy path as an explicit compatibility/failure fallback so an
          # already-cached older index can still boot if the authoritative versioned
          # entry has not propagated or cannot be resolved.
          cp -R dist _site/dist
          touch _site/.nojekyll

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
