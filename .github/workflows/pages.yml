name: Test and Deploy GitHub Pages

# Pages source must be set to GitHub Actions in repository Settings > Pages.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Test and build
        run: npm test

      - name: Stage static site
        if: github.event_name != 'pull_request'
        run: |
          BUILD_ID="${GITHUB_SHA}"
          mkdir -p "_site/build/${BUILD_ID}"
          cp index.html styles.css _site/

          # Commit-versioned build path is the browser authority. Because every relative
          # ESM import stays under this directory, a new deployment cannot mix old and
          # new cached modules.
          cp -R dist/. "_site/build/${BUILD_ID}/"
          printf '%s\n' "${BUILD_ID}" > _site/version.txt

          # Keep the legacy path during the transition so an already-cached old index.html
          # can still boot while the new index propagates through Pages/CDN caches.
          cp -R dist _site/dist
          touch _site/.nojekyll

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
