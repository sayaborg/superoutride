name: M9.19 isolated baseline snapshot

# Temporary feature-branch transport only. Restored before the implementation PR.
# This workflow cannot publish Pages or change main.
on:
  push:
    branches: [feat/m9-19-progressive-drift-calibration]
permissions:
  contents: read
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: c03dee6a94e2a9009781d98d4758de657eab16da
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: |
          test "$(git rev-parse HEAD)" = c03dee6a94e2a9009781d98d4758de657eab16da
          npm ci
          git bundle create /tmp/superoutride-baseline.bundle HEAD refs/remotes/origin/main
          tar -czf /tmp/superoutride-baseline-dependencies.tar.gz node_modules
      - uses: actions/upload-artifact@v5
        with:
          name: m9-19-baseline-source
          path: |
            /tmp/superoutride-baseline.bundle
            /tmp/superoutride-baseline-dependencies.tar.gz
          retention-days: 1
