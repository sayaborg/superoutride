name: Stage 4b final verification

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  verify:
    if: github.head_ref == 'codex/stage4b-band-ground-20260923'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXPECTED_TREE: 2687f8863f885c0f19ba431f76029d39dd57aaeb
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Restore reviewed Stage 4b source with byte and tree checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, gzip, hashlib, json, os, pathlib, subprocess, urllib.request
          root = pathlib.Path.cwd()
          report = pathlib.Path(os.environ['RUNNER_TEMP']) / 'stage4b-report'
          report.mkdir()
          parts = ['b2e337df85657eac0e8bcd0e61754b22c3f19a1c', '536d7f16d76ce121441a1da91aadccdcce8e4ce9', 'c52a9b29e0787b4500bc73b59024db9fa7e748d7']
          packed = b''
          for sha in parts:
              req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/blobs/' + sha, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
              with urllib.request.urlopen(req) as response:
                  blob = json.load(response)
              data = base64.b64decode(blob['content'])
              assert hashlib.sha1(('blob %d\0' % len(data)).encode() + data).hexdigest() == sha
              packed += data
          assert hashlib.sha1(('blob %d\0' % len(packed)).encode() + packed).hexdigest() == 'ae9708f216aff3e3f6a074b3603a57b3db40dcd2'
          payload = json.loads(gzip.decompress(packed))
          for change in payload['changes']:
              path = root / change['path']
              assert path.resolve().is_relative_to(root)
              original = path.read_text() if path.exists() else ''
              if change['base'] is None:
                  assert not path.exists()
              else:
                  assert hashlib.sha256(original.encode()).hexdigest() == change['base'], str(path)
              result = original
              for start, end, replacement in reversed(change['edits']):
                  result = result[:start] + replacement + result[end:]
              assert hashlib.sha256(result.encode()).hexdigest() == change['sha256'], str(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(result)
          for name in payload['delete']:
              path = root / name
              assert path.resolve().is_relative_to(root)
              path.unlink()
          browser = payload['browser'].replace('/mnt/data/stage4b/', str(report) + '/')
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'stage4b-browser.mjs').write_text(browser)
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == os.environ['EXPECTED_TREE'], tree
          print('Verified source tree:', tree)
          PY
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/course-reference
          key: course-reference-${{ runner.os }}-node24-stage4b-final
          restore-keys: course-reference-${{ runner.os }}-node24-
      - name: Node 24 standing checks and reference products
        run: npm test
      - name: Browser startup and three-mode state-preserving switching
        run: |
          set -euo pipefail
          python3 -m http.server 8765 --bind 127.0.0.1 > "$RUNNER_TEMP/stage4b-report/http.log" 2>&1 &
          HTTP_PID=$!
          google-chrome --headless=new --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9222 --user-data-dir="$RUNNER_TEMP/stage4b-chrome" about:blank > "$RUNNER_TEMP/stage4b-report/chrome.log" 2>&1 &
          CHROME_PID=$!
          trap 'kill "$HTTP_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9222/json/version > /dev/null && curl -fsS http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node "$RUNNER_TEMP/stage4b-browser.mjs" | tee "$RUNNER_TEMP/stage4b-report/browser.json"
      - name: Store verified tree without moving a branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, urllib.request
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == os.environ['EXPECTED_TREE']
          elements = []
          for line in subprocess.check_output(['git', 'diff', '--cached', '--name-status', '--no-renames', 'HEAD'], text=True).splitlines():
              status, path = line.split('\t', 1)
              entry = {'path': path, 'mode': '100644', 'type': 'blob'}
              if status == 'D':
                  entry['sha'] = None
              else:
                  entry['content'] = pathlib.Path(path).read_text()
              elements.append(entry)
          base = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          body = json.dumps({'base_tree': base, 'tree': elements}).encode()
          req = urllib.request.Request('https://api.github.com/repos/' + os.environ['GITHUB_REPOSITORY'] + '/git/trees', data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json'})
          with urllib.request.urlopen(req) as response:
              result = json.load(response)
          assert result['sha'] == tree, result['sha']
          summary = {'tree': tree, 'sourceHead': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(), 'changedPaths': len(elements), 'node24Checks': 'passed', 'browserChecks': 'passed'}
          (pathlib.Path(os.environ['RUNNER_TEMP']) / 'stage4b-report' / 'tree.json').write_text(json.dumps(summary, indent=2))
          print(json.dumps(summary))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stage4b-verification
          path: ${{ runner.temp }}/stage4b-report
          retention-days: 3
