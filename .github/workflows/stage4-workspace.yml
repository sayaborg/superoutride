name: Stage 4 source publication

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'codex/stage4a-band-ground-20260922' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      BASE_SHA: 0ca118aa9be15d3661d83546f5185f14ae3fb1d2
      FINAL_TREE: bac2cafbf447af27281c2c4689ff593c5d0e2ff1
      EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
      SOURCE_BRANCH: codex/stage4a-band-ground-20260922
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Restore the verified source delta and remove this temporary workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          def git(*args):
              return subprocess.check_output(['git', *args]).decode()
          base = os.environ['BASE_SHA']
          assert git('rev-parse', 'HEAD').strip() == os.environ['EXPECTED_HEAD']
          changed = git('diff', '--name-only', base, 'HEAD').splitlines()
          assert changed == ['.github/workflows/stage4-workspace.yml'], changed
          blobs = ['5389b366589d7adb15e071cb761b7eee79b4c211', '5f0e2a5ce73bd0b397107d48cf38839442482d18', 'c23bf3226c31d4d8016fdd065a1eedbddfa91772', 'b242bfcf6bfa81803aa25e84dca9de332eb38aca']
          data = b''
          for sha in blobs:
              payload = json.loads(subprocess.check_output(['gh', 'api', f'repos/{os.environ["GITHUB_REPOSITORY"]}/git/blobs/{sha}']))
              part = base64.b64decode(payload['content'])
              assert hashlib.sha1(f'blob {len(part)}\0'.encode() + part).hexdigest() == sha
              data += part
          assert hashlib.sha256(data).hexdigest() == 'fb4fb12e9fa582a952cf526b9be318f4c11318decd53ee0f7b7a176434129420'
          def path(value):
              p = pathlib.Path(value)
              assert not p.is_absolute() and '..' not in p.parts and '.git' not in p.parts
              return p
          for record in json.loads(lzma.decompress(data)):
              target = path(record['path'])
              if record.get('delete'):
                  target.unlink()
                  continue
              source = record['base']
              lines = [] if source is None else git('show', f'{base}:{path(source)}').splitlines(keepends=True)
              for start, end, text in reversed(record['edits']):
                  lines[start:end] = [text]
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(''.join(lines))
              if source is not None and source != record['path']:
                  path(source).unlink()
          subprocess.run(['git', 'add', '-A'], check=True)
          tree = git('write-tree').strip()
          assert tree == os.environ['FINAL_TREE'], tree
          print('Restored verified source tree:', tree)
          PY
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: .cache/course-reference
          key: stage4-reference-${{ runner.os }}-node24-${{ github.event.pull_request.head.sha }}
          restore-keys: |
            stage4-reference-${{ runner.os }}-node24-
            course-reference-${{ runner.os }}-node24-
      - name: Complete Node 24 checks
        run: npm test
      - name: Verify browser startup and paused same-scene filter controls
        run: |
          mkdir -p /tmp/stage4-browser
          python3 -m http.server 8765 >/tmp/stage4-browser/http.log 2>&1 &
          HTTP_PID=$!
          google-chrome --headless --no-sandbox --disable-dev-shm-usage --remote-debugging-port=9229 --user-data-dir=/tmp/stage4-chrome about:blank >/tmp/stage4-browser/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill "$HTTP_PID" "$CHROME_PID" 2>/dev/null || true' EXIT
          cat >/tmp/stage4-browser/check.mjs <<'JS'
          import assert from 'node:assert/strict';
          import {writeFile} from 'node:fs/promises';
          const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));
          let pages;
          for (let i = 0; i < 100; i++) {
            try { pages = await (await fetch('http://127.0.0.1:9229/json')).json(); if (pages.length) break; } catch {}
            await sleep(100);
          }
          assert.ok(pages?.length, 'Chrome did not start');
          const ws = new WebSocket(pages.find(p => p.type === 'page').webSocketDebuggerUrl);
          await new Promise((resolve, reject) => {ws.addEventListener('open', resolve, {once:true}); ws.addEventListener('error', reject, {once:true});});
          let sequence = 0;
          const pending = new Map(), exceptions = [];
          ws.addEventListener('message', event => {
            const value = JSON.parse(event.data);
            if (value.method === 'Runtime.exceptionThrown') exceptions.push(value.params);
            const item = pending.get(value.id);
            if (item) { clearTimeout(item.timer); pending.delete(value.id); value.error ? item.reject(Error(JSON.stringify(value.error))) : item.resolve(value.result); }
          });
          function call(method, params = {}) {
            return new Promise((resolve, reject) => {
              const id = ++sequence;
              const timer = setTimeout(() => {pending.delete(id); reject(Error('CDP timeout: '+method));}, 30000);
              pending.set(id, {resolve,reject,timer}); ws.send(JSON.stringify({id,method,params}));
            });
          }
          async function evaluate(expression) {
            const result = await call('Runtime.evaluate', {expression, returnByValue:true, awaitPromise:true});
            if (result.exceptionDetails) throw Error(JSON.stringify(result.exceptionDetails));
            return result.result.value;
          }
          await call('Runtime.enable'); await call('Page.enable');
          await call('Emulation.setDeviceMetricsOverride', {width:1024,height:768,deviceScaleFactor:1,mobile:false});
          const observations = [];
          for (const mode of ['ribbon-coast','ribbon-fork','ribbon-ring','linear']) {
            const oldOrigin = await evaluate('performance.timeOrigin');
            const url = `http://127.0.0.1:8765/?mode=${mode}&session=CUSTOM&vehicle=TESTAROSSA&rivals=0&clock=off&autostart=1`;
            await call('Page.navigate', {url});
            let started = false;
            for (let i = 0; i < 300; i++) {
              try {started = await evaluate(`location.href === ${JSON.stringify(url)} && performance.timeOrigin !== ${oldOrigin} && !!document.querySelector('output[aria-label="Session status"]')?.textContent`);} catch {}
              if (started) break;
              await sleep(100);
            }
            assert.ok(started, 'No first rendered frame for '+mode);
            await evaluate(`Array.from(document.querySelectorAll('button')).find(b=>b.textContent.trim()==='PAUSE').click();document.querySelector('#dev-panel').open=true`);
            const initial = await evaluate(`({url:location.href,status:document.querySelector('output[aria-label="Session status"]').textContent,time:performance.timeOrigin})`);
            assert.equal(initial.status, 'PAUSED');
            const filters = [];
            for (const name of mode === 'linear' ? [] : ['POINT','BOX','TENT','BOX']) {
              const observation = await evaluate(`(()=>{const b=Array.from(document.querySelectorAll('#dev-panel button')).find(b=>b.textContent===${JSON.stringify(name)});if(!b)throw Error('Missing filter');b.click();const pixels=document.querySelector('#game').getContext('2d').getImageData(0,0,320,240).data;let hash=2166136261;for(const v of pixels)hash=Math.imul(hash^v,16777619);return {filter:b.textContent,pressed:b.getAttribute('aria-pressed'),url:location.href,status:document.querySelector('output[aria-label="Session status"]').textContent,time:performance.timeOrigin,hash:hash>>>0,hud:document.querySelector('output[aria-label="Course performance"]').textContent};})()`);
              assert.equal(observation.pressed, 'true');
              for (const key of ['url','status','time']) assert.equal(observation[key], initial[key], key+' changed during filter switch');
              assert.ok(observation.hud.includes('Bands '+name));
              filters.push(observation);
            }
            if (mode !== 'linear') assert.equal(filters[1].hash, filters[3].hash, 'Returning to BOX changed a paused scene');
            else assert.equal(await evaluate(`Array.from(document.querySelectorAll('#dev-panel legend')).some(x=>x.textContent==='Band lateral filter')`), false);
            const image = await call('Page.captureScreenshot', {format:'png'});
            await writeFile(`/tmp/stage4-browser/${mode}.png`, Buffer.from(image.data, 'base64'));
            observations.push({mode,initial,filters});
          }
          await writeFile('/tmp/stage4-browser/observations.json', JSON.stringify({observations,exceptions},null,2));
          assert.equal(exceptions.length,0,JSON.stringify(exceptions));
          console.log(JSON.stringify({courses:observations.map(o=>o.mode),pausedSwitchChecks:observations.reduce((n,o)=>n+o.filters.length,0),runtimeExceptions:exceptions.length}));
          ws.close();
          JS
          node /tmp/stage4-browser/check.mjs
      - name: Preserve browser observations outside product source
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stage4-browser-observations
          path: /tmp/stage4-browser
          retention-days: 7
      - name: Publish only the verified feature tree without force
        run: |
          test "$(git write-tree)" = "$FINAL_TREE"
          test "$(git ls-remote origin "refs/heads/$SOURCE_BRANCH" | cut -f1)" = "$EXPECTED_HEAD"
          git config user.name sayaborg
          git config user.email 277042689+sayaborg@users.noreply.github.com
          git commit -m 'Stage 4a: introduce independent ordered Band ground and live lateral comparison'
          test "$(git rev-parse HEAD^{tree})" = "$FINAL_TREE"
          git push origin "HEAD:refs/heads/$SOURCE_BRANCH"
          echo "Published feature head $(git rev-parse HEAD)"
