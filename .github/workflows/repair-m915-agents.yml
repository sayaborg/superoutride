name: Repair M9.15 AGENTS diff

on:
  push:
    branches:
      - m9-15-absolute-slide-one-k-tire

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v5
        with:
          ref: m9-15-absolute-slide-one-k-tire
          fetch-depth: 0

      - name: Restore main contract and add only scoped M9.15 authority
        shell: bash
        run: |
          set -euo pipefail
          git show 5a108b435ecdaf30e8b7ada37aa6de5a28f78e71:AGENTS.md > AGENTS.md
          python3 - <<'PY'
          from pathlib import Path

          path = Path('AGENTS.md')
          text = path.read_text()

          text = text.replace(
              "The current vehicle-physics architecture authority is:\n\n```text\ndocs/108_m9_14_compact_touch_expanded_diagnostic_ranges.md",
              "The current vehicle-physics architecture authority is:\n\n```text\ndocs/109_m9_15_absolute_slide_one_k_tire.md\ndocs/108_m9_14_compact_touch_expanded_diagnostic_ranges.md",
              1,
          )

          old_tire = '''M9.10 remains the current post-peak tire constitutive-law authority. It preserves the M9.9 compiled
          axle-neutral reference seed and one stateless C1 lateral-demand-driven post-peak scale. Pure
          longitudinal behavior and the monotone scalar implicit wheel solve remain unchanged because the
          post-peak lateral scale is independent of wheel angular speed during the solve. Historical browser
          SLIDE comparison tables are superseded for current DEV selector scope by M9.14. No drift mode,
          drift assist, target sideslip, yaw/beta feedback, tire memory, vehicle-kind branch or drive-layout
          handling branch is added. Handling remains `DEV_UNCALIBRATED`.

          M9.12 keeps the existing three-scalar vehicle-owned tire calibration and exposes three independent
          browser characteristics without adding physics state:

          ```text
          GRIP  = peak force height
          PEAK  = common normalized slip at peak
          SLIDE = large-lateral-slip plateau / peak
          ```

          Changing one browser tire axis preserves the other two displayed characteristics. Physics still
          stores only positive finite reference-friction, linear-stiffness and sliding-friction-ratio
          calibration values; GRIP/PEAK/SLIDE IDs are browser-derived and are not stored in mechanics.
          Longitudinal and lateral PEAK are not split: the model remains one common one-k normalized demand
          law. SLIDE remains lateral-post-peak only.

          M9.14 is the current scoped DEV tire selector-range authority. Current tire selector domain is:

          ```text
          GRIP  = 2.00 / 2.20 / 2.40 / 2.60 / 2.80 / 3.00 /
                  3.20 / 3.40 / 3.60 / 3.80 / 4.00                         default 2.00
          PEAK  = 20 / 22 / 24 / 26 / 28 / 30 / 32 / 34 / 36 / 38 / 40 /
                  42 / 44 / 46 / 48 / 50 / 52 / 54 / 56 / 58 / 60 %       default 20%
          SLIDE = 60 / 65 / 70 / 75 / 80 / 85 / 90 / 95 / 100 %          default 80%
          ```

          The current `11 x 21 x 9 = 2,079` browser product is diagnostic and regression coverage keeps the
          retained scalar wheel solve finite across that product. Values such as GRIP=4.00, PEAK=60% and
          SLIDE=100% are explicit diagnostic probes, not frozen real-production-tire claims. The earlier
          M9.12C observation remains useful lineage: at fixed `GRIP=2.00`, larger PEAK values were preferred
          through `PEAK=30%`; at fixed GRIP, increasing PEAK lowers initial force slope while preserving the
          peak-force ceiling. If improvement remains monotonic toward extreme probes, diagnose omitted or
          compressed transient/compliance behavior before treating those values literally. Candidate omitted
          effects include tire relaxation, body-roll transient/compliance and left/right load-transfer
          dynamics. M9.14 authorizes no such new state.'''

          new_tire = '''M9.15 is the current scoped post-peak tire-law and browser tire-calibration authority. It retains
          the state-free one-k demand vector, radial C1 saturation, friction-circle bound, force direction,
          the existing three-scalar vehicle calibration and the monotone scalar implicit wheel solve.
          Browser characteristics are now:

          ```text
          G = absolute peak friction coefficient at gripFactor=1
          P = common normalized slip at peak
          S = absolute deep-slide friction coefficient at gripFactor=1
          ```

          Physics still stores only positive finite `referenceFrictionMultiplier`,
          `linearStiffnessMultiplier` and `slidingFrictionRatio`. Absolute S is derived browser meaning rather
          than a fourth scalar:

          ```text
          slidingFrictionRatio = S / G
          ```

          Changing G preserves displayed P and absolute S; changing P preserves G and S; changing S preserves
          G and P. The lateral post-peak C1 transition starts at P and reaches the selected S plateau at
          exactly 2P. Because the post-peak scale remains independent of wheel angular speed during one wheel
          solve, the retained finite bracket, monotone residual and unique bisection root remain valid.

          M9.14 remains current for the G/P diagnostic ranges, D range and touch travel; M9.15 supersedes its
          percentage-S meaning and browser tire starting calibration. Current tire selector domain is:

          ```text
          G = 2.00 / 2.20 / 2.40 / 2.60 / 2.80 / 3.00 /
              3.20 / 3.40 / 3.60 / 3.80 / 4.00                            default 3.00
          P = 20 / 22 / 24 / 26 / 28 / 30 / 32 / 34 / 36 / 38 / 40 /
              42 / 44 / 46 / 48 / 50 / 52 / 54 / 56 / 58 / 60 %          default 20%
          S = 1.00 / 1.20 / 1.40 / 1.60 / 1.80 / 2.00                    default 1.00
          ```

          The current `11 x 21 x 6 = 1,386` browser product is diagnostic. The initial
          `G=3.00 / P=20% / S=1.00` candidate has internal `S/G=1/3`; that strong separation is a
          falsification probe, not a production-tire realism claim. M9.10 remains the retained foundation for
          the state-free lateral-demand-only post-peak scale and wheel-root proof outside M9.15's scoped
          transition-width and S-meaning supersession. M9.12 remains the three-axis independence foundation.
          No drift mode, target sideslip, yaw/beta feedback, tire memory, fourth calibration scalar,
          vehicle-kind branch or drive-layout handling branch is added. Handling remains
          `DEV_UNCALIBRATED`.'''

          old_tire = '\n'.join(line[10:] if line.startswith('          ') else line for line in old_tire.splitlines())
          new_tire = '\n'.join(line[10:] if line.startswith('          ') else line for line in new_tire.splitlines())
          if text.count(old_tire) != 1:
              raise SystemExit('expected exactly one current M9.14 tire authority block')
          text = text.replace(old_tire, new_tire, 1)

          replacements = [
              (
                  "Its old browser comparison table is historical; later M9.10/M9.12/M9.14 documents own current tire\ncomparison behavior.",
                  "Its old browser comparison table is historical; later M9.10/M9.12/M9.14/M9.15 documents own\ncurrent tire comparison behavior.",
              ),
              (
                  "remain retained where not otherwise superseded. M9.14 changes only the retained touch travel\ncalibration and browser DEV comparison ranges.",
                  "remain retained where not otherwise superseded. M9.14 changes the retained touch travel and\nbrowser DEV comparison ranges; M9.15 changes only the current tire law and tire selector meaning.",
              ),
              (
                  "latest `GRIP=2.00 / PEAK=30%` handling observation and restart/release procedure. It predates\nM9.13/M9.14 and is navigation context for handling continuation only; for current touch-driving and\nbrowser comparison ranges use documents 108/107 plus the current README/docs index. The handoff\ndoes not replace numbered milestone authority, source/types/compilers, regression tests, immutable\nvalidation evidence or current Git/PR/workflow state. A fresh agent should re-fetch current main and\nrelease evidence before assuming the embedded M9.12C SHA or selector ranges are still current.",
                  "latest `GRIP=2.00 / PEAK=30%` handling observation and restart/release procedure. It predates\nM9.13/M9.14/M9.15 and is navigation context for handling continuation only; for current tire and\ntouch work use documents 109/108/107 plus the current README/docs index. The handoff does not\nreplace numbered milestone authority, source/types/compilers, regression tests, immutable validation\nevidence or current Git/PR/workflow state. A fresh agent should re-fetch current main and release\nevidence before assuming the embedded M9.12C SHA or selector ranges are still current.",
              ),
              (
                  "continuation checkpoint, while recognizing that it predates M9.13/M9.14 touch/range authority.",
                  "continuation checkpoint, while recognizing that it predates M9.13/M9.14/M9.15 touch/tire authority.",
              ),
              (
                  "6. Identify and read the newest numbered authority documents for the requested topic. For current\n   touch-driving work start with M9.14 -> M9.13. For current handling/range work use M9.14 ->\n   M9.12C -> M9.12B -> M9.12A -> M9.12 -> M9.11 -> M9.10 -> M9.9 as applicable.",
                  "6. Identify and read the newest numbered authority documents for the requested topic. For current\n   touch-driving work start with M9.14 -> M9.13. For current tire/handling work use M9.15 ->\n   M9.14 -> M9.12C -> M9.12B -> M9.12A -> M9.12 -> M9.11 -> M9.10 -> M9.9 as applicable.",
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected exactly one AGENTS replacement: {old[:80]!r}')
              text = text.replace(old, new, 1)

          marker = "docs/108_m9_14_compact_touch_expanded_diagnostic_ranges.md\n```"
          if text.count(marker) != 2:
              raise SystemExit('expected browser and lineage M9.14 list endings')
          text = text.replace(
              marker,
              "docs/108_m9_14_compact_touch_expanded_diagnostic_ranges.md\ndocs/109_m9_15_absolute_slide_one_k_tire.md\n```",
              2,
          )

          path.write_text(text)
          PY

          rm .github/workflows/repair-m915-agents.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AGENTS.md .github/workflows/repair-m915-agents.yml
          git commit -m "Restore minimal M9.15 agent contract diff"
          git push origin HEAD:m9-15-absolute-slide-one-k-tire
