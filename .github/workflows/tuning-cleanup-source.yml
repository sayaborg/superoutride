name: Temporary tuning cleanup source export
on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/tuning-cleanup-source.yml]
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Export exact source without credentials
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"
          tar -czf "$RUNNER_TEMP/source.tar.gz" .
      - uses: actions/upload-artifact@v5
        with:
          name: tuning-cleanup-source
          path: ${{ runner.temp }}/source.tar.gz
          retention-days: 1
