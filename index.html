<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05080c" />
    <title>SUPER OUTRIDE — M6.52</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-label="SUPER OUTRIDE M6.52 driving">
      <section class="control-zone steering-zone" aria-label="Steering control">
        <div id="steering-pad" class="steering-pad" role="application" aria-label="Analog steering pad">
          <span class="steer-left">◀</span>
          <span class="steer-center">STEER</span>
          <span class="steer-right">▶</span>
        </div>
      </section>

      <section class="game-zone">
        <canvas id="game" width="320" height="240" aria-label="SUPER OUTRIDE game screen"></canvas>
      </section>

      <section class="control-zone pedal-zone" aria-label="Throttle and brake controls">
        <button id="brake-button" class="pedal brake" type="button">BRAKE</button>
        <button id="throttle-button" class="pedal throttle" type="button">THROTTLE</button>
      </section>
    </main>

    <script type="module">
      // Keep BRANCHING as the default product fixture while exposing the new CIRCUIT
      // composition through one explicit top-level boot choice. Lower engine layers do
      // not receive a mode flag or a route-kind branch.
      const circuitMode = new URLSearchParams(location.search).get('mode') === 'circuit';
      const entryName = circuitMode ? 'main-circuit.js' : 'main.js';
      const fallbackEntry = `./dist/${entryName}`;
      let entry = fallbackEntry;

      try {
        const response = await fetch(`./version.txt?t=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          const version = (await response.text()).trim();
          if (/^[0-9a-f]{40}$/.test(version)) {
            // Import the complete build from a commit-specific directory. Relative ESM imports
            // therefore inherit the versioned path instead of reusing stale /dist/*.js modules.
            entry = `./build/${version}/${entryName}`;
          }
        }
      } catch {
        // Local development has no version.txt; use the normal tsc output below.
      }

      try {
        await import(entry);
      } catch (error) {
        console.error('Versioned SUPER OUTRIDE boot failed; trying development fallback.', error);
        if (entry !== fallbackEntry) await import(`${fallbackEntry}?t=${Date.now()}`);
        else throw error;
      }
    </script>
  </body>
</html>
