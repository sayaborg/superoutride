<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05080c" />
    <title>SUPER OUTRIDE — M9.14</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-label="SUPER OUTRIDE M9.14 driving">
      <nav class="mobile-selector-zone" aria-label="Course vehicle camera steering and tire calibration selection">
        <section class="selector-group selector-group-course" aria-labelledby="course-selector-label">
          <span id="course-selector-label" class="selector-label">COURSE</span>
          <div id="course-selector-buttons" class="selector-buttons course-selector-buttons"></div>
        </section>
        <section class="selector-group selector-group-vehicle" aria-labelledby="vehicle-selector-label">
          <span id="vehicle-selector-label" class="selector-label">VEHICLE</span>
          <div id="vehicle-selector-buttons" class="selector-buttons vehicle-selector-buttons"></div>
        </section>
        <section class="selector-group selector-group-camera" aria-labelledby="camera-selector-label">
          <span id="camera-selector-label" class="selector-label">CAMERA</span>
          <div id="camera-selector-buttons" class="selector-buttons camera-selector-buttons"></div>
        </section>
        <section class="selector-group selector-group-steering-offset" aria-labelledby="steering-offset-selector-label">
          <span id="steering-offset-selector-label" class="selector-label">D</span>
          <div id="steering-offset-selector-buttons" class="selector-buttons steering-offset-selector-buttons"></div>
        </section>
        <section class="selector-group selector-group-max-steer" aria-labelledby="max-steer-selector-label">
          <span id="max-steer-selector-label" class="selector-label">M</span>
          <div id="max-steer-selector-buttons" class="selector-buttons max-steer-selector-buttons"></div>
        </section>
        <section class="selector-group selector-group-act" aria-labelledby="steering-response-selector-label">
          <span id="steering-response-selector-label" class="selector-label">ACT</span>
          <div id="steering-response-selector-buttons" class="selector-buttons steering-response-selector-buttons"></div>
        </section>
        <section class="selector-group selector-group-tire" aria-labelledby="tire-friction-selector-label">
          <span id="tire-friction-selector-label" class="selector-label">TIRE</span>
          <div id="tire-friction-selector-buttons" class="selector-buttons tire-friction-selector-buttons"></div>
        </section>
      </nav>

      <section class="control-zone steering-zone" aria-label="Legacy steering fallback">
        <div class="steering-pad" role="group" aria-label="Legacy digital steering buttons">
          <button id="steer-left-button" class="steer-button" type="button" aria-label="Steer left">◀</button>
          <span class="steer-center">STEER</span>
          <button id="steer-right-button" class="steer-button" type="button" aria-label="Steer right">▶</button>
        </div>
      </section>

      <section class="game-zone">
        <canvas id="game" width="320" height="240" aria-label="SUPER OUTRIDE game screen"></canvas>
      </section>

      <section class="control-zone pedal-zone" aria-label="Legacy throttle and brake fallback">
        <button id="brake-button" class="pedal brake" type="button">BRAKE</button>
        <button id="throttle-button" class="pedal throttle" type="button">THROTTLE</button>
      </section>
    </main>

    <script type="module">
      // One top-level boot owns LINEAR / BRANCHING / CIRCUIT selection and 1/2/3/4 navigation.
      // Lower engine layers receive only the ordinary runtime objects selected by that boot.
      const entryName = 'boot.js';
      const fallbackEntry = `./dist/${entryName}`;
      let entry = fallbackEntry;

      try {
        const response = await fetch(`./version.txt?t=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          const version = (await response.text()).trim();
          if (/^[0-9a-f]{40}$/.test(version)) {
            // Import the complete build from a commit-specific directory. Relative ESM imports
            // therefore inherit the versioned path instead of reusing stale /dist/*.js modules.
            entry = `./build/${version}/${entryName}`;
          }
        }
      } catch {
        // Local development has no version.txt; use the normal tsc output below.
      }

      try {
        await import(entry);
      } catch (error) {
        console.error('Versioned SUPER OUTRIDE boot failed; trying development fallback.', error);
        if (entry !== fallbackEntry) await import(`${fallbackEntry}?t=${Date.now()}`);
        else throw error;
      }
    </script>
  </body>
</html>
