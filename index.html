<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#05080c" />
    <title>SUPER OUTRIDE</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main id="app" aria-label="SUPER OUTRIDE driving">
      <!-- DEV controls: the composition root builds them from this template only with dev=1. -->
      <template id="dev-panel-template">
        <details id="dev-panel" data-driving-input="ignore">
          <summary class="selector-button dev-toggle">
            DEV <span class="dev-open-label">OPEN</span><span class="dev-close-label">CLOSE</span>
          </summary>
          <nav class="mobile-selector-zone" aria-label="DEV settings">
            <section class="selector-group selector-group-sound" aria-label="Audio mix">
              <div id="engine-volume"></div>
              <div id="tire-volume"></div>
            </section>
            <section class="selector-group selector-group-sound" aria-label="Sound controls">
              <button id="sound-toggle" class="selector-button" type="button" aria-pressed="true">SOUND START</button>
              <span>MASTER</span>
              <div id="sound-volume"></div>
              <span class="selector-label">TIRES: UNIFIED</span>
              <div
                id="tire-component-controls"
                class="selector-buttons"
                role="group"
                aria-label="Tire sound components"
              ></div>
              <span>ENGINE · WAVEGUIDE</span>
            </section>
            <section class="selector-group selector-group-sound-settings" aria-label="Tire sound settings">
              <div id="tire-sound-settings"></div>
            </section>
            <section class="selector-group selector-group-sound-settings" aria-label="Rolling tire sound settings">
              <div id="rolling-sound-settings"></div>
            </section>
            <section class="selector-group selector-group-sound-settings" aria-label="Mix sound settings">
              <div id="mix-sound-settings"></div>
            </section>
            <section class="selector-group selector-group-sound-settings" aria-label="Sound timing settings">
              <div id="timing-sound-settings"></div>
            </section>
            <section class="selector-group selector-group-sound-settings" aria-label="Rival sound settings">
              <div id="rival-sound-settings"></div>
            </section>
            <section class="selector-group selector-group-sound-settings" aria-label="Engine sound settings">
              <span class="selector-label">ENGINE TUNING · provisional · adjust with − / +</span>
              <div id="engine-sound-settings"></div>
            </section>
            <section class="selector-group selector-group-recovery" aria-labelledby="recovery-label">
              <span id="recovery-label" class="selector-label">RECOVERY</span>
              <div class="selector-buttons">
                <button
                  id="recover-button"
                  class="selector-button"
                  type="button"
                  aria-label="Recover the player vehicle"
                >
                  RECOVER
                </button>
              </div>
            </section>
            <section class="selector-group selector-group-tuning" aria-labelledby="tuning-steering-label">
              <span id="tuning-steering-label" class="selector-label">STEERING · M D ACT</span>
              <div id="tuning-steering-buttons" class="selector-buttons tuning-buttons"></div>
            </section>
            <section class="selector-group selector-group-tuning" aria-labelledby="tuning-pedal-label">
              <span id="tuning-pedal-label" class="selector-label">PEDALS · apply + / release − seconds</span>
              <div id="tuning-pedal-buttons" class="selector-buttons tuning-buttons"></div>
            </section>
            <section class="selector-group selector-group-tuning" aria-labelledby="tuning-tire-label">
              <span id="tuning-tire-label" class="selector-label">TIRES F/R</span>
              <div id="tuning-tire-buttons" class="selector-buttons tuning-buttons"></div>
            </section>
            <section class="selector-group selector-group-tuning" aria-labelledby="tuning-powertrain-label">
              <span id="tuning-powertrain-label" class="selector-label">POWERTRAIN · game-wide</span>
              <div id="tuning-powertrain-buttons" class="selector-buttons tuning-buttons"></div>
            </section>
            <section class="selector-group selector-group-tuning" aria-labelledby="tuning-rival-label">
              <span id="tuning-rival-label" class="selector-label">RIVAL PACE · game-wide</span>
              <div id="tuning-rival-buttons" class="selector-buttons tuning-buttons"></div>
            </section>
            <section class="selector-group selector-group-tuning" aria-labelledby="tuning-contact-label">
              <span id="tuning-contact-label" class="selector-label">BODY CONTACT · game-wide</span>
              <div id="tuning-contact-buttons" class="selector-buttons tuning-buttons"></div>
            </section>
            <section class="selector-group selector-group-tuning" aria-labelledby="tuning-assist-label">
              <span id="tuning-assist-label" class="selector-label">ASSISTS</span>
              <div id="tuning-assist-buttons" class="selector-buttons"></div>
            </section>
            <section class="selector-group selector-group-export" aria-labelledby="export-label">
              <span id="export-label" class="selector-label">EXPORT · saved definition files</span>
              <div class="selector-buttons">
                <button id="export-driving-button" class="selector-button" type="button">driving/default.json</button>
                <button id="export-vehicle-button" class="selector-button" type="button">vehicles/…json</button>
                <button id="export-audio-button" class="selector-button" type="button" title="Export sound settings">
                  audio/default.json
                </button>
              </div>
            </section>
          </nav>
        </details>
      </template>

      <section class="game-zone">
        <canvas id="game" width="320" height="240" aria-label="SUPER OUTRIDE game screen"></canvas>
      </section>
    </main>

    <script type="module">
      // One composition root creates the page and assembles its runs.
      // Lower engine layers receive only the ordinary runtime objects it selects.
      const entryName = 'shell/main-course.js';
      const localEntry = `./dist/${entryName}`;
      let entry = localEntry;

      try {
        const response = await fetch(`./version.txt?t=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          const version = (await response.text()).trim();
          if (/^[0-9a-f]{40}$/.test(version)) {
            // Import the complete build from a commit-specific directory. Relative ESM imports
            // therefore inherit the versioned path without mixing modules from different commits.
            entry = `./build/${version}/${entryName}`;
          }
        }
      } catch {
        // Local development has no version.txt; use the normal tsc output below.
      }

      await import(entry);
    </script>
  </body>
</html>
