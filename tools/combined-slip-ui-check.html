<!doctype html><meta charset="utf-8"><title>LP responsive regression</title>
<style>body{font:14px monospace;background:#111;color:#eee}iframe{border:0;display:block}pre{white-space:pre-wrap}</style>
<h1>LP responsive regression</h1><pre id="result">Running…</pre><iframe title="Actual game under test"></iframe>
<script type="module">
const result=document.querySelector('#result'),frame=document.querySelector('iframe');
const reports=[];
try {
 for(const [width,height] of [[320,568],[390,844],[568,320],[844,390],[1366,768]]) {
  frame.style.width=width+'px';frame.style.height=height+'px';
  await new Promise(resolve=>{frame.onload=resolve;frame.src='../?mode=circuit';});
  const doc=frame.contentDocument;
  await new Promise((resolve,reject)=>{
   const ready=()=>doc.querySelectorAll('.tire-control').length===6;
   if(ready())return resolve();
   const watcher=new MutationObserver(()=>{if(ready()){watcher.disconnect();clearTimeout(timeout);resolve();}});
   const timeout=setTimeout(()=>{watcher.disconnect();reject(Error('selectors did not mount'));},10000);
   watcher.observe(doc,{subtree:true,childList:true});
  });
  await new Promise(resolve=>frame.contentWindow.requestAnimationFrame(resolve));
  const groups=[...doc.querySelectorAll('.tire-control,.engine-power-button')];
  const check=(ok,msg)=>{if(!ok)throw Error(`${width}x${height}: ${msg}`);};
  check(groups.length===7,'six axes + ENG');
  for(const e of groups){const r=e.getBoundingClientRect();check(r.left>=0&&r.right<=width&&r.bottom<=height,'group fits viewport');check(e.scrollWidth<=e.clientWidth,'no internal overflow');}
  for(const e of doc.querySelectorAll('.tire-value'))check(e.scrollWidth<=e.clientWidth,'label fits');
  const canvas=doc.querySelector('#game');check(canvas.width===320&&canvas.height===240,'backing resolution');
  const lp=groups[5],value=()=>lp.querySelector('.tire-value').textContent;
  check(value()==='LP 2.00','default');lp.querySelectorAll('button')[0].click();check(value()==='LP 8.00','minus wrap');
  lp.querySelectorAll('button')[1].click();check(value()==='LP 2.00','plus wrap');
  doc.defaultView.dispatchEvent(new KeyboardEvent('keydown',{code:'KeyB',bubbles:true}));
  check(value()==='LP 2.50','keyboard forward cycle');
  check(groups[0].textContent.includes('2.50')&&groups[4].textContent.includes('0.74'),'other axes preserved');
  reports.push({width,height,groups:7,status:'PASS'});
 }
 result.textContent=JSON.stringify({status:'PASS',reports},null,2);
}catch(error){result.textContent=JSON.stringify({status:'FAIL',error:error.message,reports},null,2);}
</script>
