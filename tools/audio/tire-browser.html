<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SUPER OUTRIDE — UNIFIED tire audition</title>
    <style>
      body {
        font: 16px system-ui;
        color: #e7eaf2;
        background: #111722;
        max-width: 780px;
        margin: 48px auto;
        padding: 0 24px;
      }
      h1 {
        font-size: 26px;
      }
      p {
        line-height: 1.8;
        color: #bdc9da;
      }
      button,
      select {
        font: inherit;
        padding: 10px 16px;
        margin: 6px 8px 6px 0;
        border-radius: 6px;
      }
      a {
        color: #71dacc;
      }
      pre {
        white-space: pre-wrap;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <h1>UNIFIED タイヤ音の試聴</h1>
    <p>
      直進 → 横滑り → 回復 → ロック → 土 →
      停止。前後それぞれの音を確認できます。試聴用の入力値で、走行物理の再現ではありません。
    </p>
    <label
      >発音
      <select id="axles">
        <option value="both">前後</option>
        <option value="front">前輪のみ</option>
        <option value="rear">後輪のみ</option>
      </select></label
    >
    <div><button id="play">試聴する</button><button id="stop">停止</button></div>
    <pre id="result">待機中</pre>
    <p><a href="audio-browser.html">エンジン音の調整</a> · <a href="../../?mode=ribbon-ring">ゲームで確認</a></p>
    <script type="module" src="./tire-browser.js"></script>
  </body>
</html>
