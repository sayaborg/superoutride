<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SUPER OUTRIDE — UNIFIED tire audition</title>
    <style>
      body {
        font: 16px system-ui;
        color: #e7eaf2;
        background: #111722;
        max-width: 780px;
        margin: 48px auto;
        padding: 0 24px;
      }
      h1 {
        font-size: 26px;
      }
      p {
        line-height: 1.8;
        color: #bdc9da;
      }
      button,
      select {
        font: inherit;
        padding: 10px 16px;
        margin: 6px 8px 6px 0;
        border-radius: 6px;
      }
      a {
        color: #71dacc;
      }
      pre {
        white-space: pre-wrap;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <h1>UNIFIED tire sound preview</h1>
    <p>
      Straight → sideslip → recovery → lock → dirt → stop. Front and rear can be heard separately. The inputs are for
      preview and do not reproduce driving physics.
    </p>
    <label
      >Axles
      <select id="axles">
        <option value="both">Front and rear</option>
        <option value="front">Front only</option>
        <option value="rear">Rear only</option>
      </select></label
    >
    <div><button id="play">Play</button><button id="stop">Stop</button></div>
    <pre id="result">Waiting</pre>
    <p><a href="audio-browser.html">Engine sound tuning</a> · <a href="../../?course=ribbon-ring">Check in game</a></p>
    <script type="module" src="./tire-browser.js"></script>
  </body>
</html>
