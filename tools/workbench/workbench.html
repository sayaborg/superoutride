<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench — SUPER OUTRIDE</title>
    <link rel="stylesheet" href="workbench.css" />
  </head>
  <body>
    <header>
      <h1>SUPER OUTRIDE workbench</h1>
      <p id="status" role="status" data-state="running">Opening the build…</p>
    </header>
    <nav id="modules" aria-label="Modules"></nav>
    <main>
      <div id="module"></div>
      <aside aria-label="Compile">
        <h2>Diagnostics</h2>
        <ul id="diagnostics"></ul>
        <details>
          <summary id="products-summary">Products</summary>
          <table>
            <thead>
              <tr>
                <th>Kind</th>
                <th>ID</th>
                <th>Bytes</th>
                <th>SHA-256</th>
              </tr>
            </thead>
            <tbody id="products"></tbody>
          </table>
        </details>
      </aside>
    </main>
    <script type="module" src="./workbench.js"></script>
  </body>
</html>
