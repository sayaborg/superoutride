<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SUPER OUTRIDE — Tire audition</title>
    <style>
      body {
        font: 16px system-ui;
        color: #e7eaf2;
        background: #111722;
        max-width: 780px;
        margin: 48px auto;
        padding: 0 24px;
      }
      h1 {
        font-size: 26px;
      }
      p {
        line-height: 1.8;
        color: #bdc9da;
      }
      button,
      select {
        font: inherit;
        padding: 10px 16px;
        margin: 6px 8px 6px 0;
        border-radius: 6px;
      }
      a {
        color: #71dacc;
      }
      pre {
        white-space: pre-wrap;
        line-height: 1.7;
      }
    </style>
  </head>
  <body>
    <h1>タイヤ音の試聴</h1>
    <p>
      直進 → 横滑り → 回復 → ロック → 土 →
      停止。前後それぞれの音を確認できます。試聴用の入力値で、走行物理の再現ではありません。
    </p>
    <label
      >発音
      <select id="axles">
        <option value="both">前後</option>
        <option value="front">前輪のみ</option>
        <option value="rear">後輪のみ</option>
      </select></label
    >
    <div>
      <button id="play">試聴する</button><button id="stop">停止</button><button id="verify">音声出力を検証</button>
    </div>
    <pre id="result">待機中</pre>
    <p><a href="audio-browser.html">エンジン音の調整</a> · <a href="../?mode=circuit">ゲームで確認</a></p>
    <script type="module">
      import { createTireVoice } from '../dist/audio/tire-voice.js';
      import { createVehicleAudioObservation } from '../dist/browser/vehicle-audio.js';
      const result = document.getElementById('result');
      let playback,
        playing,
        generation = 0;
      function stop() {
        generation++;
        playing?.stop();
        playing?.disconnect();
        playing = null;
      }
      async function render(rate, axles) {
        const context = new OfflineAudioContext(1, rate * 9, rate);
        await context.audioWorklet.addModule(new URL('../dist/audio/tire-processor.js', import.meta.url));
        const voice = createTireVoice(context, context.destination);
        const state = createVehicleAudioObservation();
        const phases = [
          {
            load: 4000,
            rollingSpeed: 25,
            slipSpeed: 0,
            utilization: 0.2,
            longitudinalPower: 0,
            lateralPower: 0,
            surface: 'ASPHALT',
          },
          { slipSpeed: 5, utilization: 0.85, lateralPower: 8000 },
          { slipSpeed: 10, utilization: 1.2, lateralPower: 30000 },
          { slipSpeed: 0, utilization: 0.2, lateralPower: 0 },
          { slipSpeed: 25, utilization: 1.2, longitudinalPower: 45000 },
          { surface: 'DIRT' },
          { load: 0, rollingSpeed: 0, slipSpeed: 0, longitudinalPower: 0, lateralPower: 0 },
        ];
        function apply(phase) {
          for (const axle of ['front', 'rear'])
            if (axles === 'both' || axles === axle) Object.assign(state[axle], phase);
          voice.update(state);
        }
        apply(phases[0]);
        for (let i = 1; i < phases.length; i++)
          void context.suspend(i).then(() => {
            apply(phases[i]);
            return context.resume();
          });
        try {
          return await context.startRendering();
        } finally {
          voice.dispose();
        }
      }
      document.getElementById('stop').onclick = () => {
        stop();
        result.textContent = '停止';
      };
      document.getElementById('play').onclick = async () => {
        stop();
        const current = generation;
        try {
          playback ??= new AudioContext();
          await playback.resume();
          result.textContent = '準備中';
          const buffer = await render(48000, document.getElementById('axles').value);
          if (current !== generation) return;
          playing = playback.createBufferSource();
          playing.buffer = buffer;
          playing.connect(playback.destination);
          playing.start();
          result.textContent = '再生中：直進 → 横滑り → 回復 → ロック → 土 → 停止';
          playing.onended = () => {
            if (current === generation) result.textContent = '再生終了';
          };
        } catch (error) {
          if (current === generation) result.textContent = String(error);
        }
      };
      document.getElementById('verify').onclick = async () => {
        stop();
        const current = generation;
        result.textContent = '検証中';
        try {
          const lines = [];
          for (const rate of [44100, 48000])
            for (const axle of ['front', 'rear', 'both']) {
              const buffer = await render(rate, axle);
              const data = buffer.getChannelData(0);
              let peak = 0,
                energy = 0,
                tail = 0;
              for (let i = 0; i < data.length; i++) {
                const x = data[i];
                if (!Number.isFinite(x)) throw Error('nonfinite output');
                peak = Math.max(peak, Math.abs(x));
                energy += x * x;
                if (i > rate * 8) tail += x * x;
              }
              if (!(peak > 0.01 && peak < 0.7 && tail < 1e-12)) throw Error(`invalid output ${rate} ${axle}`);
              lines.push(
                `${rate} Hz / ${axle}: PASS · peak ${peak.toFixed(4)} · RMS ${Math.sqrt(energy / data.length).toFixed(4)}`,
              );
            }
          if (current === generation) result.textContent = lines.join('\n');
        } catch (error) {
          if (current === generation) result.textContent = String(error);
        }
      };
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stop();
      });
      window.addEventListener('pagehide', () => {
        stop();
        void playback?.close();
      });
    </script>
  </body>
</html>
