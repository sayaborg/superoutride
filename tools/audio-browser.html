<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Procedural audio verification</title>
  </head>
  <body>
    <h1>エンジン音の比較</h1>
    <p>
      同じ回転数・同じ実効音量で音色を比較します。試聴は3秒で止まります。新方式はGolf・Corvette・Harleyの3台に対応しています。
    </p>
    <label
      >車種
      <select id="vehicle"></select
    ></label>
    <label>回転数 <input id="rpm" type="number" min="1000" max="12000" value="3000" step="500" /></label>
    <label
      >アクセル
      <select id="load">
        <option value="1">全開</option>
        <option value="0">全閉</option>
      </select></label
    >
    <label
      >試聴内容
      <select id="scenario">
        <option value="steady">一定回転</option>
        <option value="rev">加速 → アクセルOFF</option>
      </select></label
    >
    <button id="before" type="button">前回の方式を聴く</button>
    <button id="after" type="button">ウェーブガイドを聴く</button>
    <button id="reflection" type="button">簡易反射を聴く</button>
    <button id="stop" type="button">停止</button>
    <p id="listening">未再生</p>
    <button id="run" type="button">Verify engine voices</button>
    <pre id="result">Ready</pre>
    <script type="module">
      import { createPeriodicEngineVoice } from '../dist/audio/periodic-engine-voice.js';
      import { createEngineVoice } from '../dist/audio/engine-voice.js';
      import { VEHICLE_CATALOG } from '../dist/vehicle/vehicle-catalog.js';
      import { createVehicleAudioObservation } from '../dist/browser/vehicle-audio.js';
      const result = document.getElementById('result');
      const vehicle = document.getElementById('vehicle');
      for (const entry of VEHICLE_CATALOG) {
        const option = document.createElement('option');
        option.value = String(vehicle.options.length);
        option.textContent = entry.profile.id + (entry.sound.exhaust ? '（新方式対応）' : '（従来方式）');
        vehicle.append(option);
      }
      vehicle.value = '3';
      let playback,
        playing,
        request = 0;
      const listening = document.getElementById('listening');
      function stop() {
        request++;
        playing?.stop();
        playing?.disconnect();
        playing = null;
        listening.textContent = '停止';
      }
      document.getElementById('stop').onclick = stop;
      async function audition(mode) {
        stop();
        const current = request;
        try {
          playback ??= new AudioContext();
          await playback.resume();
          const entry = VEHICLE_CATALOG[Number(vehicle.value)];
          const context = new OfflineAudioContext(1, 4 * 48000, 48000);
          const state = createVehicleAudioObservation();
          Object.assign(state, {
            rpm: Number(document.getElementById('rpm').value) || 3000,
            idleRpm: entry.profile.powertrain.idleRpm,
            redlineRpm: entry.profile.powertrain.redlineRpm,
            throttle: Number(document.getElementById('load').value),
            drive: Number(document.getElementById('load').value),
          });
          await context.audioWorklet.addModule(new URL('../dist/audio/noise-processor.js', import.meta.url));
          const voice =
            mode === 'periodic'
              ? createPeriodicEngineVoice(context, context.destination)
              : createEngineVoice(context, context.destination, mode === 'waveguide', entry.sound);
          voice.update(state, entry.sound);
          if (document.getElementById('scenario').value === 'rev') {
            const target = Math.max(state.idleRpm, Math.min(state.rpm, state.redlineRpm));
            state.rpm = state.idleRpm;
            state.throttle = state.drive = 0;
            voice.update(state, entry.sound);
            for (let tick = 20; tick < 80; tick++) {
              const time = tick / 20;
              void context.suspend(time).then(() => {
                const accelerating = time < 2.5;
                state.throttle = state.drive = accelerating ? 1 : 0;
                const fraction = accelerating ? (time - 1) / 1.5 : 1 - (time - 2.5) / 1.5;
                state.rpm = state.idleRpm + (target - state.idleRpm) * fraction;
                voice.update(state, entry.sound);
                return context.resume();
              });
            }
          }
          const rendered = await context.startRendering();
          voice?.dispose();
          if (current !== request) return;
          const samples = rendered.getChannelData(0).subarray(48000);
          let power = 0,
            peak = 0;
          for (const value of samples) {
            power += value * value;
            peak = Math.max(peak, Math.abs(value));
          }
          const scale = Math.min(0.12 / Math.sqrt(power / samples.length), 0.85 / peak);
          const buffer = playback.createBuffer(1, samples.length, 48000);
          const output = buffer.getChannelData(0);
          for (let i = 0; i < output.length; i++) {
            const fade = Math.min(1, i / 960, (output.length - 1 - i) / 960);
            output[i] = samples[i] * scale * fade;
          }
          playing = playback.createBufferSource();
          playing.buffer = buffer;
          playing.connect(playback.destination);
          playing.onended = () => {
            if (current === request) listening.textContent = '再生終了';
          };
          playing.start();
          listening.textContent = `${mode}・${entry.profile.id}`;
        } catch (error) {
          listening.textContent = String(error);
        }
      }
      document.getElementById('before').onclick = () => audition('periodic');
      document.getElementById('reflection').onclick = () => audition('reflection');
      document.getElementById('after').onclick = () => audition('waveguide');
      document.addEventListener('visibilitychange', () => {
        if (document.hidden) stop();
      });
      window.addEventListener('pagehide', () => {
        stop();
        void playback?.close();
      });

      document.getElementById('run').onclick = async () => {
        result.textContent = 'Running';
        try {
          const rows = [];
          for (const sampleRate of [44100, 48000]) {
            for (const entry of VEHICLE_CATALOG) {
              const amplitudes = [];
              for (const [rpm, throttle] of [0, 3000, 6000].flatMap((rpm) => [
                [rpm, 0],
                [rpm, 1],
              ])) {
                const context = new OfflineAudioContext(1, sampleRate / 2, sampleRate);
                await context.audioWorklet.addModule(new URL('../dist/audio/noise-processor.js', import.meta.url));
                const voice = createEngineVoice(context, context.destination, true, entry.sound);
                const observation = createVehicleAudioObservation();
                Object.assign(observation, {
                  rpm,
                  throttle,
                  drive: throttle,
                  idleRpm: entry.profile.powertrain.idleRpm,
                  redlineRpm: entry.profile.powertrain.redlineRpm,
                });
                voice.update(observation, entry.sound);
                const rendered = await context.startRendering();
                const samples = rendered.getChannelData(0);
                let peak = 0,
                  power = 0,
                  crossings = 0;
                for (let i = (sampleRate / 4) | 0; i < samples.length; i++) {
                  const value = samples[i];
                  if (!Number.isFinite(value)) throw new Error('nonfinite sample');
                  peak = Math.max(peak, Math.abs(value));
                  power += value * value;
                  if (samples[i - 1] <= 0 && value > 0) crossings++;
                }
                const rms = Math.sqrt(power / (samples.length - ((sampleRate / 4) | 0)));
                if (!(rms > 0.0001 && peak < 1)) throw new Error(`invalid output: ${entry.profile.id} ${rpm}`);
                const frequency =
                  Math.max(observation.idleRpm, Math.min(rpm, observation.redlineRpm)) /
                  (60 * entry.sound.cycleRevolutions);
                const lag = sampleRate / frequency;
                function periodicError(offset) {
                  let difference = 0,
                    reference = 0;
                  for (let i = (sampleRate / 4) | 0; i + offset + 1 < samples.length; i++) {
                    const shifted = i + offset,
                      index = Math.floor(shifted),
                      fraction = shifted - index;
                    const value = samples[index] * (1 - fraction) + samples[index + 1] * fraction;
                    difference += (samples[i] - value) ** 2;
                    reference += samples[i] ** 2;
                  }
                  return difference / reference;
                }
                const error = periodicError(lag),
                  displaced = periodicError(lag * 0.9);
                if (!entry.sound.exhaust && !(error < 0.02 && displaced > error * 5)) {
                  throw new Error(`invalid periodicity: ${entry.profile.id} ${rpm}: ${error}, ${displaced}`);
                }
                amplitudes.push({ rpm, throttle, peak, rms, crossings, periodicError: error });
                voice.dispose();
              }
              rows.push({ vehicle: entry.profile.id, sampleRate, amplitudes });
            }
          }
          result.textContent = JSON.stringify({ status: 'PASS', rows }, null, 2);
        } catch (error) {
          result.textContent = JSON.stringify({ status: 'FAIL', error: String(error) });
        }
      };
    </script>
  </body>
</html>
