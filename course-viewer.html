<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Course viewer — SUPER OUTRIDE</title>
  </head>
  <body>
    <p>Opening the current build's course viewer…</p>
    <script type="module">
      // The one course viewer address: open the course viewer of the build version.txt names, as the game finds its build.
      // Local development has no version.txt and opens the local build.
      let page = './dist/tools/course-viewer/course-viewer.html';
      try {
        const response = await fetch(`./version.txt?t=${Date.now()}`, { cache: 'no-store' });
        if (response.ok) {
          const version = (await response.text()).trim();
          if (/^[0-9a-f]{40}$/.test(version)) page = `./build/${version}/tools/course-viewer/course-viewer.html`;
        }
      } catch {
        // Keep the local build.
      }
      location.replace(new URL(page + location.search + location.hash, location.href));
    </script>
  </body>
</html>
